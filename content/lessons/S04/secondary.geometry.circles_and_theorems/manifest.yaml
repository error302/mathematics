outcomes:
  - Apply the Inscribed Angle Theorem (angle ACB = 1/2 angle AOB) and Thales's Theorem to prove angle relationships in circles.
  - Complete the square on x^2 + y^2 + Dx + Ey + F = 0 to find the center and squared radius R^2, and apply the Power of a Point (Intersecting Chords) Theorem.
