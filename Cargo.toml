[workspace]
resolver = "2"
members = [
  "crates/axiom-math",
  "crates/axiom-learning",
  "crates/axiom-content",
  "crates/axiom-wasm",
  "crates/axiom-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
num-bigint = { version = "0.4", default-features = false, features = ["std", "serde"] }
num-rational = { version = "0.4", default-features = false, features = ["std", "num-bigint-std", "serde"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }
num-integer = { version = "0.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
hex = { version = "0.4" }
thiserror = { version = "2" }
wasm-bindgen = { version = "0.2" }
axiom-math = { path = "crates/axiom-math" }
axiom-learning = { path = "crates/axiom-learning" }
axiom-content = { path = "crates/axiom-content" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
