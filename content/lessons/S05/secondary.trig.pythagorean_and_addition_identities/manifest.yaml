outcomes:
  - Derive and apply the Pythagorean and quotient identities (tan theta = sin theta / cos theta) over exact rational triangles.
  - Apply the angle-sum and double-angle identities for sine and cosine (sin(2*theta) = 2 sin(theta)cos(theta), cos(alpha + beta) = cos(alpha)cos(beta) - sin(alpha)sin(beta)).
